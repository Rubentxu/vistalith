[workspace]
resolver = "3"
members = [
    "crates/vistalith-domain",
    "crates/vistalith-graph",
    "crates/vistalith-agent-runtime",
    "crates/vistalith-server",
    "crates/vistalith-sddk-bridge",
]
# dev/ holds the pinned SDDK checkout: it is its own cargo workspace and is
# consumed as path dependencies, never as members of this workspace.
# crates/vistalith-spike-surrealdb is the SurrealDB gate spike (SPK-003): it
# pins its own nightly toolchain because surrealdb 3.x does not build on any
# stable we use — a spike must never gate product builds (see
# docs/SURREALDB-SPIKE.md).
# apps/desktop/src-tauri is the Tauri 2 desktop shell: it ships its own
# dependency tree (GTK/WebKit) and is built through the desktop pnpm scripts.
exclude = [
    "dev",
    "crates/vistalith-spike-surrealdb",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["Rubentxu"]

[workspace.dependencies]
# --- SDDK core: direct path dependencies into the pinned intermediate
# checkout under dev/ (see scripts/sddk-pin.env + docs/DEPENDENCIES.md).
# All crates resolve to the same pinned revision; never mix revisions.
sddk-domain = { path = "dev/sddk-framework/crates/sddk-domain" }
sddk-storage = { path = "dev/sddk-framework/crates/sddk-storage" }
sddk-engine = { path = "dev/sddk-framework/crates/sddk-engine" }
sddk-gateway = { path = "dev/sddk-framework/crates/sddk-gateway" }
sddk-vault = { path = "dev/sddk-framework/crates/sddk-vault" }
sddk-testkit = { path = "dev/sddk-framework/crates/sddk-testkit" }

# --- Baseline pins (technology/STACK.md) ---
# Consumed by the agent-runtime slice; recorded here as the version line
# agreed in the baseline. Verified when vistalith-agent-runtime lands.
rig-core = "0.42"
# rmcp: official Rust MCP SDK, direct (ADR-009). Client + both baseline
# transports; `server` is on for the mcp-echo fixture used by tests.
rmcp = { version = "=3.2.0", default-features = false, features = [
    "client",
    "server",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
petgraph = "0.8"
# SurrealDB is NOT a workspace dependency: the SPK-003 spike lives in the
# self-contained crates/vistalith-spike-surrealdb (excluded above) because
# surrealdb 3.x does not compile on the pinned stable toolchain. If the gate
# ever opens, adoption lands here behind a storage boundary.

# Shared infrastructure, pinned at bootstrap; exact versions in Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

# --- Vistalith crates ---
vistalith-domain = { path = "crates/vistalith-domain" }
vistalith-graph = { path = "crates/vistalith-graph" }
vistalith-agent-runtime = { path = "crates/vistalith-agent-runtime" }
vistalith-sddk-bridge = { path = "crates/vistalith-sddk-bridge" }

[profile.release]
lto = "thin"
